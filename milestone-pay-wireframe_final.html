<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milestone Pay MVP Wireframe</title>
<style>
:root{
  --ink:#1d1d1f; --ink2:#55565c; --ink3:#8a8b91; --line:#c9c9ce; --line2:#e3e3e6;
  --paper:#fafaf8; --card:#ffffff; --fill:#efefec; --fill2:#e4e4e0;
  --note:#2a5bd7; --note-bg:#eef2fd; --ok:#2f7d4f; --ok-bg:#e8f3ec; --bad:#b3401f; --bad-bg:#fbece7;
  --warn:#8a6100; --warn-bg:#fbf3dc; --pp:#ffc439;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans)}
button{font:inherit;cursor:pointer;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 12px}
button:hover{background:var(--fill)}
button.primary{background:var(--ink);color:#fff}
button.primary:hover{background:#000}
button.ghost{border-color:var(--line);color:var(--ink2)}
button.small{padding:3px 8px;font-size:12px}
button:disabled{opacity:.4;cursor:not-allowed}
.pp-btn{background:var(--pp);border:none;border-radius:20px;font-weight:700;width:100%;padding:10px}
.pp-btn:hover{background:#f2b52a}
textarea,input{font:inherit;width:100%;border:1.5px dashed var(--line);border-radius:6px;padding:8px;background:var(--card);color:var(--ink)}
code,.mono{font-family:var(--mono);font-size:12px}
h1,h2,h3,h4{margin:0 0 8px;line-height:1.2}
h2{font-size:18px} h3{font-size:15px} h4{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
p{margin:0 0 8px}
/* top bar */
header{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1.5px solid var(--ink)}
.logo{font-weight:800;letter-spacing:-.01em}
.logo small{font-weight:500;color:var(--ink3);margin-left:6px}
.tabs{display:flex;gap:4px}
.tabs button{border-color:transparent}
.tabs button.on{border-color:var(--ink);background:var(--fill)}
.spacer{flex:1}
label.tog{white-space:nowrap;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
/* layout */
#flow{display:grid;grid-template-columns:210px minmax(0,1fr) 340px;min-height:calc(100vh - 54px)}
#flow.nohood{grid-template-columns:210px minmax(0,1fr)}
#flow.nohood #hood{display:none}
#rail{border-right:1.5px solid var(--line);padding:14px 10px;background:var(--card)}
#rail ol{list-style:none;padding:0;margin:0;counter-reset:s}
#rail li{counter-increment:s}
#rail li button{width:100%;text-align:left;border:none;background:none;padding:7px 8px;border-radius:6px;display:flex;gap:8px;align-items:flex-start}
#rail li button::before{content:counter(s);flex:0 0 20px;height:20px;border:1.5px solid var(--ink3);border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--ink2)}
#rail li button.done::before{content:"✓";background:var(--ink);color:#fff;border-color:var(--ink)}
#rail li button.on{background:var(--fill2);font-weight:600}
#rail .who{display:block;font-size:11px;color:var(--ink3);font-weight:400}
#rail .legend{margin-top:16px;font-size:12px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:10px}
#stage{padding:18px;overflow:auto}
#hood{border-left:1.5px solid var(--line);background:var(--note-bg);padding:14px;overflow:auto;max-height:calc(100vh - 54px);position:sticky;top:54px}
#hood h3{color:var(--note)}
.kv{display:grid;grid-template-columns:78px 1fr;gap:4px 8px;font-size:12px;margin-bottom:12px}
.kv dt{color:var(--note);font-weight:700;font-family:var(--mono);font-size:11px;padding-top:2px}
.kv dd{margin:0}
.tag{display:inline-block;font:11px var(--mono);padding:1px 6px;border-radius:4px;border:1px solid currentColor;margin:1px 2px 1px 0}
.tag.tk{color:var(--ok)} .tag.cu{color:var(--warn)} .tag.ai{color:var(--note)}
.log{list-style:none;padding:0;margin:0;font-size:12px}
.log li{padding:5px 0;border-bottom:1px dashed #c8d3f2;display:grid;grid-template-columns:62px 1fr;gap:6px}
.log .who{font:10px var(--mono);text-transform:uppercase;padding-top:2px}
.who-ai{color:var(--note)} .who-pp{color:#946c00} .who-agent{color:#6b3fb8} .who-client{color:var(--ok)} .who-free{color:var(--ink)} .who-sys{color:var(--ink3)}
/* frames */
.frames{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.desk{flex:1 1 520px;min-width:0;border:1.5px solid var(--ink);border-radius:10px;background:var(--card);overflow:hidden}
.desk .bar{display:flex;gap:6px;align-items:center;padding:7px 10px;border-bottom:1.5px solid var(--ink);background:var(--fill)}
.desk .bar i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink3)}
.desk .bar span{margin-left:8px;font:12px var(--mono);color:var(--ink2)}
.desk .body{padding:16px}
.phonewrap{flex:0 0 300px;width:300px}
.phone{border:2px solid var(--ink);border-radius:28px;padding:12px 10px;background:var(--card)}
.phone .notch{width:90px;height:16px;border-radius:0 0 10px 10px;background:var(--ink);margin:-12px auto 8px}
.phone .screen{border:1.5px solid var(--line);border-radius:14px;min-height:520px;max-height:640px;overflow:auto;padding:12px}
.frame-label{font:11px var(--mono);color:var(--ink3);margin-bottom:6px;text-transform:uppercase}
/* wire primitives */
.card{border:1.5px solid var(--line);border-radius:8px;padding:12px;background:var(--card);margin-bottom:12px}
.box{border:1.5px dashed var(--line);border-radius:8px;padding:12px;background:var(--fill);margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border:1.5px solid var(--line);border-radius:8px;padding:10px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--ink2)}
.muted{color:var(--ink3)} .small{font-size:12px}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);background:var(--fill);white-space:nowrap}
.pill.draft{} .pill.agreed{background:#fff}
.pill.authorized{background:var(--warn-bg);border-color:#e3cf94;color:var(--warn)}
.pill.submitted,.pill.verified{background:var(--note-bg);border-color:#bccbf3;color:var(--note)}
.pill.paid{background:var(--ok-bg);border-color:#b5d7c1;color:var(--ok)}
.pill.voided,.pill.revision_requested{background:var(--bad-bg);border-color:#efc3b5;color:var(--bad)}
.empty{border:1.5px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);margin-bottom:6px}
/* chat */
.chat{display:flex;flex-direction:column;gap:6px;max-height:430px;overflow:auto;padding:4px}
.msg{max-width:88%;border:1.5px solid var(--line);border-radius:10px;padding:6px 9px;font-size:13px;background:var(--card);transition:background .2s}
.msg.me{align-self:flex-end;background:var(--fill)}
.msg .meta{font:10px var(--mono);color:var(--ink3);display:block}
.msg.hl{outline:2.5px solid var(--note);background:var(--note-bg)}
.msg .tr{display:block;margin-top:4px;padding-top:3px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink2)}
.msg .tr::before{content:attr(data-l) " · ";font:10px var(--mono);color:var(--note)}
select{font:inherit;font-size:12px;border:1.5px solid var(--ink);border-radius:6px;padding:3px 6px;background:var(--card);color:var(--ink)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:12px;background:var(--fill);margin-top:10px}
.drop input[type=file]{border:none;padding:0;background:none;width:auto}
.badge{font:10px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--card);color:var(--ink2)}
.frow{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line2);font-size:12px}
.frow .thumb{flex:0 0 34px;height:34px;border:1.5px solid var(--ink3);border-radius:4px;background:repeating-linear-gradient(135deg,var(--fill) 0 5px,var(--card) 5px 10px);display:grid;place-items:center;font:9px var(--mono);color:var(--ink2)}
.frow .fname{flex:1;min-width:0;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow button{padding:2px 7px;font-size:11px}
.strip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.strip .s{border:1.5px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px}
.strip .s.cur{border-color:var(--ink);background:var(--fill)}
.revform{border:1.5px solid var(--bad);border-radius:8px;padding:8px;background:var(--card);margin-top:6px}
.revform label{display:flex;gap:6px;align-items:flex-start;font-size:12px;margin:3px 0}
.revform label input{width:auto;margin-top:2px}
.preview{height:220px;border:1.5px solid var(--line);border-radius:8px;background:repeating-linear-gradient(135deg,var(--fill) 0 8px,var(--card) 8px 16px);display:grid;place-items:center;text-align:center;color:var(--ink2);font-size:13px;margin:8px 0}
.msg.inj{border-color:var(--bad);border-style:dashed}
.chip{font:11px var(--mono);border:1px solid var(--note);color:var(--note);background:var(--note-bg);border-radius:4px;padding:0 5px;cursor:pointer;margin-left:3px}
.field{display:grid;grid-template-columns:100px 1fr;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line2);font-size:13px}
.field dt{color:var(--ink2);font-size:12px}
.field dd{margin:0}
.gap{border-left:3px solid var(--warn);background:var(--warn-bg);padding:7px 9px;border-radius:0 6px 6px 0;margin-bottom:6px;font-size:13px}
.gap.fixed{border-color:var(--ok);background:var(--ok-bg)}
.gap.inj{border-color:var(--bad);background:var(--bad-bg)}
.ms{border:1.5px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px}
.ms .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ms ul{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--ink2)}
.hash{font:11px var(--mono);background:var(--fill);border:1px solid var(--line);padding:2px 6px;border-radius:4px}
.crit{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line2);font-size:13px}
.res{font:11px var(--mono);text-align:center;border-radius:4px;padding:2px 0;height:fit-content}
.res.pass{background:var(--ok-bg);color:var(--ok)} .res.fail{background:var(--bad-bg);color:var(--bad)} .res.human{background:var(--warn-bg);color:var(--warn)}
.file{display:flex;gap:8px;align-items:center;font:12px var(--mono);padding:4px 0}
.file::before{content:"";width:22px;height:26px;border:1.5px solid var(--ink3);border-radius:2px}
.trace{font:12px var(--mono);background:#16171a;color:#d7d9de;border-radius:8px;padding:10px;white-space:pre-wrap;line-height:1.55}
.trace .t{color:#8fb3ff} .trace .ok{color:#7fd19b} .trace .no{color:#ff9a7a} .trace .c{color:#8a8d96}
.proposal{border:2px solid #6b3fb8;border-radius:10px;padding:12px;background:#f5f0fc}
.tl{position:relative;border:1.5px solid var(--line);border-radius:8px;padding:10px 10px 4px}
.tl .axis{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--ink3);margin-bottom:6px;padding-left:140px}
.tl .r{display:grid;grid-template-columns:140px 1fr;align-items:center;margin-bottom:6px;font-size:12px}
.tl .track{position:relative;height:18px;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),var(--line2) calc(10% - 1px) 10%)}
.tl .b{position:absolute;top:2px;height:14px;border-radius:4px;border:1.5px solid var(--ink);background:var(--fill2)}
.tl .b.paid{background:var(--ok-bg);border-color:var(--ok)}
.tl .b.authorized,.tl .b.submitted,.tl .b.verified{background:var(--warn-bg);border-color:var(--warn)}
.tl .b.blocked{background:repeating-linear-gradient(45deg,var(--fill) 0 4px,var(--card) 4px 8px);border-style:dashed}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:12px;color:var(--ink2);border-bottom:1.5px solid var(--ink);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* toast + modal */
#toast{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;flex-direction:column;gap:8px}
#toast div{background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:340px}
#toast div b{color:var(--pp)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:center;z-index:40}
#modal.show{display:grid}
#modal .m{width:min(360px,92vw);background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:16px}
.anno{font:11px var(--mono);color:var(--note);border:1px dashed var(--note);background:var(--note-bg);padding:2px 6px;border-radius:4px;display:inline-block;margin:4px 0}
.hideanno .anno{display:none}
/* plan */
#plan{max-width:1060px;margin:0 auto;padding:22px 16px 60px}
#plan section{margin-bottom:28px}
#plan h2{border-bottom:1.5px solid var(--ink);padding-bottom:6px;margin-bottom:12px}
#plan pre{background:#16171a;color:#e3e5ea;padding:12px;border-radius:8px;overflow:auto;font:12px/1.5 var(--mono)}
.loop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.loop span{border:1.5px solid var(--ink);border-radius:6px;padding:4px 8px;background:var(--card)}
.loop i{color:var(--ink3);font-style:normal}
.arch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-size:12px}
.arch div{border:1.5px solid var(--ink);border-radius:8px;padding:8px;background:var(--card)}
.arch div.ext{border-style:dashed;background:var(--fill)}
.arch b{display:block;font-size:13px}
.callout{border-left:4px solid var(--note);background:var(--note-bg);padding:10px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.callout.warn{border-color:var(--warn);background:var(--warn-bg)}
.hidden{display:none!important}
@media (max-width:1100px){#flow{grid-template-columns:180px minmax(0,1fr)} #hood{grid-column:1/-1;position:static;max-height:none;border-left:none;border-top:1.5px solid var(--line)}}
@media (max-width:720px){
  #flow,#flow.nohood{grid-template-columns:minmax(0,1fr)}
  #rail{border-right:none;border-bottom:1.5px solid var(--line);min-width:0}
  #rail ol{display:flex;overflow-x:auto;gap:4px} #rail li button{white-space:nowrap} #rail .who,#rail .legend{display:none}
  .col2,.grid3,.arch{grid-template-columns:1fr}
  .phonewrap{flex-basis:100%;width:100%}
  #stage{padding:12px 16px}
}
</style>
</head>
<body>
<header>
  <div class="logo">Milestone Pay <small>day-1 MVP · lo-fi wireframe</small></div>
  <div class="tabs">
    <button id="tabFlow" class="on">Demo flow</button>
    <button id="tabPlan">MVP plan &amp; estimates</button>
  </div>
  <div class="spacer"></div>
  <label class="tog"><input type="checkbox" id="judge"> Judge mode (both sides)</label>
  <label class="tog"><input type="checkbox" id="hoodT" checked> Under the hood</label>
  <button class="ghost small" id="reset">Reset demo</button>
</header>

<main id="flow">
  <nav id="rail"><ol id="steps"></ol>
    <div class="legend">Click steps in any order. Out-of-order steps show their empty state.<br><br>
      <span class="tag tk">toolkit</span> = @paypal/agent-toolkit tool<br>
      <span class="tag cu">custom</span> = our gated REST call<br>
      <span class="tag ai">claude</span> = Sonnet call</div>
  </nav>
  <section id="stage"></section>
  <aside id="hood"></aside>
</main>

<main id="plan" class="hidden"></main>
<div id="toast"></div>
<div id="modal"><div class="m" id="modalBody"></div></div>

<script>
/* ===================== DATA ===================== */
/* lang = language of the original message ('mix' = Thai + English). tr = translation per target language.
   A translation line is shown unless the message is already entirely in the chosen language. */
/* [code, English name, native name, rtl?]. SUGGESTED have sample text in this wireframe; MORE are translated by Claude on first pick in the real app. */
const LANGS_SUGGESTED = [['th','Thai','ไทย'],['zh','Chinese (Simplified)','简体中文'],['ja','Japanese','日本語'],['ko','Korean','한국어'],['vi','Vietnamese','Tiếng Việt'],['es','Spanish','Español']];
const LANGS_MORE = [
  ['af','Afrikaans','Afrikaans'],['am','Amharic','አማርኛ'],['ar','Arabic','العربية',1],['bn','Bengali','বাংলা'],['bg','Bulgarian','Български'],
  ['my','Burmese','မြန်မာ'],['ca','Catalan','Català'],['zh-Hant','Chinese (Traditional)','繁體中文'],['hr','Croatian','Hrvatski'],['cs','Czech','Čeština'],
  ['da','Danish','Dansk'],['nl','Dutch','Nederlands'],['et','Estonian','Eesti'],['fil','Filipino','Filipino'],['fi','Finnish','Suomi'],
  ['fr','French','Français'],['de','German','Deutsch'],['el','Greek','Ελληνικά'],['gu','Gujarati','ગુજરાતી'],['ha','Hausa','Hausa'],
  ['he','Hebrew','עברית',1],['hi','Hindi','हिन्दी'],['hu','Hungarian','Magyar'],['id','Indonesian','Bahasa Indonesia'],['it','Italian','Italiano'],
  ['kn','Kannada','ಕನ್ನಡ'],['km','Khmer','ភាសាខ្មែរ'],['lo','Lao','ລາວ'],['lv','Latvian','Latviešu'],['lt','Lithuanian','Lietuvių'],
  ['ms','Malay','Bahasa Melayu'],['ml','Malayalam','മലയാളം'],['mr','Marathi','मराठी'],['ne','Nepali','नेपाली'],['no','Norwegian','Norsk'],
  ['fa','Persian','فارسی',1],['pl','Polish','Polski'],['pt','Portuguese','Português'],['pa','Punjabi','ਪੰਜਾਬੀ'],['ro','Romanian','Română'],
  ['ru','Russian','Русский'],['sr','Serbian','Српски'],['si','Sinhala','සිංහල'],['sk','Slovak','Slovenčina'],['sl','Slovenian','Slovenščina'],
  ['sw','Swahili','Kiswahili'],['sv','Swedish','Svenska'],['ta','Tamil','தமிழ்'],['te','Telugu','తెలుగు'],['tr','Turkish','Türkçe'],
  ['uk','Ukrainian','Українська'],['ur','Urdu','اردو',1],['uz','Uzbek','Oʻzbek'],['yo','Yoruba','Yorùbá'],['zu','Zulu','isiZulu'],
];
const LANGS = [['en','English','English'], ...LANGS_SUGGESTED, ...LANGS_MORE];
const langName = code => (LANGS.find(l=>l[0]===code)||[,code])[1];
const isRtl = code => !!(LANGS.find(l=>l[0]===code)||[])[3];
const hasSample = code => code==='en' || LANGS_SUGGESTED.some(l=>l[0]===code);
const langOpt = ([c,en,nat]) => `<option value="${c}" ${S.trLang===c?'selected':''}>${en===nat?en:`${en} · ${nat}`}</option>`;
const CHAT = [
  {id:'m1', from:'Nok (café owner)', me:false, t:'21:02', lang:'th', text:'สวัสดีค่ะน้องพลอย อยากได้เว็บไซต์ให้ร้าน Baan Kafe ค่ะ 🙏', tr:{
    en:'Hi Ploy! I\'d like a website for my shop, Baan Kafe 🙏', zh:'你好 Ploy！我想为我的店 Baan Kafe 做一个网站 🙏', ja:'Ployさん、こんにちは！私のお店 Baan Kafe のウェブサイトを作ってほしいです 🙏',

  {id:'m2', from:'Ploy', me:true, t:'21:04', lang:'mix', text:'ได้เลยค่ะพี่! How many pages do you need?', tr:{
    en:'Sure thing! How many pages do you need?', th:'ได้เลยค่ะพี่! ต้องการกี่หน้าคะ?', zh:'没问题！你需要几个页面？', ja:'もちろんです！何ページ必要ですか？',

      <span class="muted">This wasn't in the original agreement. You'd get:</span>

  });

  const c = S.change;
  h += `<h4 style="margin-top:12px">Need something else?</h4>`;
  if(c && c.from==='client' && !c.sent && !c.decided){
    h += `<div class="card small"><b>✓ Request sent to Ploy</b><div class="msg" style="max-width:100%;margin:6px 0">${esc(c.text)}</div>

  } else {
    h += `<button style="width:100%" onclick="S.reqOpen=true;render()">Request a change</button>`;
  }
  return h;
}

function seed(){ S.project=true; S.generated=true; log('sys','Demo project seeded'); go('review'); }
function addImports(list){
  const files = Array.from(list||[]);
  files.forEach(f=>{
    if(!IMPORT_OK.test(f.name)) return toast(`${esc(f.name)}: only JPG, PNG, HEIC, PDF or TXT`);
    if(f.size > 20*1024*1024) return toast(`${esc(f.name)} is over 20 MB`);
    if(S.imports.length >= 10) return toast('Up to 10 files per chat');
    S.imports.push({name:f.name, size:f.size});
  });

}

<section><h2>PayPal toolkit: what's installed and how to use it</h2>
<p>Your folder has <b><code>@paypal/agent-toolkit@1.11.0</code> (TypeScript/npm)</b>, with <code>ai@4.3</code>, <code>zod</code>, <code>express</code> and <code>@langchain/core</code> pulled in. The spec assumes the Python toolkit + LangChain. The simplest path is to use what's installed: the <b>Vercel AI SDK adapter</b> (<code>@paypal/agent-toolkit/ai-sdk</code>) with <code>@ai-sdk/anthropic</code>. That's one language and no LangChain layer.</p>
<div class="callout warn"><b>Gap in the toolkit:</b> its <code>create_order</code> is hard-coded to <code>intent: CAPTURE</code>, and it has no authorize, capture-authorization or void tools. So the money-holding steps are ~40 lines of our own REST calls, reusing the toolkit's client for the OAuth token (<code>toolkit.client.getHeaders()</code>). The toolkit handles reads and refunds.</div>

<pre>// paypal.js (the whole PayPal layer for day 1)
import { PayPalAgentToolkit } from '@paypal/agent-toolkit/ai-sdk';
export const pp = new PayPalAgentToolkit({
  clientId: process.env.PAYPAL_CLIENT_ID, clientSecret: process.env.PAYPAL_CLIENT_SECRET,
  configuration: {                       // whitelist ONLY what the agent needs (keeps prompts small)
    actions: { orders: { get: true }, payments: { createRefund: true, getRefunds: true } },
    context: { sandbox: true },
  },
});
const BASE = 'https://api-m.sandbox.paypal.com';
export async function ppPost(path, requestId, body) {
  const headers = { ...(await pp.client.getHeaders()), 'Content-Type': 'application/json',
                    'PayPal-Request-Id': requestId };           // idempotency
  const r = await fetch(BASE + path, { method: 'POST', headers, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error(\`PayPal \${r.status}: \${await r.text()}\`);
  return r.json();
}
export const createAuthOrder = (m) => ppPost('/v2/checkout/orders', \`order-\${m.id}\`, {
  intent: 'AUTHORIZE',
  purchase_units: [{ custom_id: m.id, amount: { currency_code: 'THB', value: (m.amount_minor / 100).toFixed(2) } }],
});
export const authorizeOrder = (orderId)  => ppPost(\`/v2/checkout/orders/\${orderId}/authorize\`, \`auth-\${orderId}\`);
export const captureAuth   = (authId)    => ppPost(\`/v2/payments/authorizations/\${authId}/capture\`, \`cap-\${authId}\`, {});
export const voidAuth      = (authId)    => ppPost(\`/v2/payments/authorizations/\${authId}/void\`, \`void-\${authId}\`);</pre>

import { generateText, tool } from 'ai';
import { anthropic } from '@ai-sdk/anthropic';        // npm i @ai-sdk/anthropic@1  (v1 pairs with ai@4)
import { z } from 'zod';
import { pp, captureAuth, voidAuth } from './paypal.js';
import { db, save, transition } from './db.js';

const approved = (id, action) => db.proposals.find(p => p.id === id && p.action === action && p.status === 'approved');
const tools = {
  get_order: pp.getTools().get_order,          // toolkit tool, unchanged
  propose_release: tool({
    description: 'Propose releasing a verified milestone. Does NOT move money.',
    parameters: z.object({ milestone_id: z.string(), reason: z.string() }),
    execute: async ({ milestone_id, reason }) => { /* insert proposal {status:'pending'} */ },
  }),
  capture_authorization: tool({
    description: 'Capture a milestone payment. Only works for a proposal the client approved.',
    parameters: z.object({ proposal_id: z.string() }),
    execute: async ({ proposal_id }) => {
      const p = approved(proposal_id, 'release');
      if (!p) return { error: 'NO_APPROVAL' };   // the model can't get past this
      const m = db.milestones.find(x => x.id === p.milestone_id);
      const cap = await captureAuth(m.authorization_id);
      transition(m, 'paid', { capture_id: cap.id }); p.status = 'executed'; save();
      return { status: cap.status };
    },
  }),
  // void_authorization: same shape, calls voidAuth()
};
export const runAgent = (event, projectState) => generateText({
  model: anthropic('claude-sonnet-5-5'), maxSteps: 4, temperature: 0, tools,
  system: SYSTEM_PROMPT,   // prompts/agent.md
  prompt: \`&lt;event&gt;\${JSON.stringify(event)}&lt;/event&gt;\\n&lt;project_state&gt;\${JSON.stringify(projectState)}&lt;/project_state&gt;\`,
});</pre>
<p class="small">Spec alternative: <code>pip install paypal-agent-toolkit</code> + LangChain + FastAPI works, but it means setting up a second toolchain and an extra framework layer on build day. It makes sense to switch only if your team is much faster in Python. That decision belongs to you and the person on track A.</p></section>

<section><h2>Architecture (day 1)</h2>
<div class="arch">
  <div><b>public/</b>index.html · app.js · styles.css<br>freelancer + client views, PayPal JS SDK button</div>
  <div><b>server.js</b> Express routes<br>~250 LOC · <code>transition()</code> owns every status change</div>
  <div><b>ai.js / agent.js</b><br>2 generateObject calls (extract, scope) + 1 tool-calling agent</div>
  <div><b>db.js</b><br>db.json read/write, ~40 LOC</div>
  <div class="ext"><b>Claude API</b> Sonnet 5.5</div>
  <div class="ext"><b>PayPal sandbox</b><br>freelancer = business acct (owns REST app), client = personal acct</div>
  <div class="ext"><b>prompts/*.md</b><br>extract · verify · scope · agent</div>
  <div class="ext"><b>scripts/smoke.js</b><br>authorize→capture→void→refund</div>
</div>
<p class="small muted" style="margin-top:8px">New deps: <code>npm i @ai-sdk/anthropic@1 multer dotenv heic-convert archiver</code> (HEIC screenshots, zip downloads). Everything else is already in node_modules. Rough size: ~1,100 LOC total.</p></section>

<section><h2>Build plan: effort and Sonnet tokens</h2>
<p>Two tracks run in parallel, matching the spec: <b>A = backend + PayPal</b>, <b>B = AI + frontend</b>. One Claude Code session (Sonnet) per slice, with <code>/clear</code> between slices. Token counts are cumulative per session, including context re-reads.</p>
<table><tr><th>#</th><th>Slice</th><th>Track</th><th class="num">Hours</th><th class="num">Input tok</th><th class="num">Output tok</th></tr>
${SLICES.map(s=>`<tr><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td><td class="num">${s[3]}</td><td class="num">${s[4]}k</td><td class="num">${s[5]}k</td></tr>`).join('')}
<tr><th></th><th>Total</th><th></th><th class="num">A ${hA}h · B ${hB}h</th><th class="num">${(totIn/1000).toFixed(2)}M</th><th class="num">${totOut}k</th></tr></table>
<div class="callout"><b>Cost at Sonnet 5.5 list price</b> ($2 in · $10 out · $2.50 cache write · $0.10 cache read per M tokens), assuming ~85% of input is cache reads, as is typical for Claude Code sessions: <b>≈ $${base.toFixed(2)}</b> for a clean run. Budget <b>~$${(base*2.5).toFixed(0)}</b> to allow for retries and debugging. Output tokens are ~${Math.round(costOut/base*100)}% of the cost, so <b>short, specific slice prompts</b> save more than anything else. Wall clock: ~${Math.max(hA,hB)}h on the longer track plus 1h setup, so <b>it fits in one long day with two people</b>. Solo, plan on ~${Math.round(SLICES.reduce((a,s)=>a+s[3],0))}h.</div>
<p class="small muted">The hours and token counts are planning estimates from typical slice sizes, not measurements. Re-check after S1 and S2 and adjust.</p></section>

<section><h2>Runtime tokens per demo loop</h2>
<table><tr><th>Call</th><th class="num">In</th><th class="num">Out</th><th class="num">≈ cost</th></tr>
<tr><td>Extract (agreement + gaps + milestones + translation, one call)</td><td class="num">4k</td><td class="num">2.9k</td><td class="num">$0.037</td></tr>
<tr><td>Agent × 2 runs (propose, then execute), ≤4 steps each</td><td class="num">30k</td><td class="num">2k</td><td class="num">$0.080</td></tr>
<tr><td>Scope classifier</td><td class="num">3k</td><td class="num">0.6k</td><td class="num">$0.012</td></tr>
<tr><td>Screenshot transcription (3 images, only if uploaded)</td><td class="num">4.5k</td><td class="num">1k</td><td class="num">$0.019</td></tr>
<tr><td>One extra translation language (Haiku, cached)</td><td class="num">1k</td><td class="num">0.6k</td><td class="num">$0.004</td></tr>
<tr><th>Full loop (M1 only)</th><th class="num">42.5k</th><th class="num">7.1k</th><th class="num">≈ $0.15</th></tr></table>
<p class="small">Each extra milestone (M2, M3…) adds one more agent pair, about $0.08. A full 3-milestone demo is ≈ $0.31, so 100 rehearsals ≈ $31. Rehearse with only M1 most of the time. Moving the scope classifier to Haiku 5.5 cuts that call to well under a cent.</p></section>

<section><h2>Ways to save tokens</h2>
<ol>
<li><b>Whitelist toolkit actions.</b> Enable only <code>orders.get</code> and <code>payments.createRefund/getRefunds</code>. Turning on all ~45 toolkit tools puts every tool schema into every agent step.</li>
<li><b>One extract call, not four.</b> Agreement, gaps, milestones, injection flags and the English translation come from one <code>generateObject</code> with one zod schema. Translate once at import and store it; the toggle never calls the AI again.</li>
<li><b>The agent never sees the raw chat.</b> It gets the frozen agreement JSON and milestone state. That makes calls smaller and blocks prompt injection.</li>
<li><b><code>maxSteps: 4</code>, temperature 0</b>, and short tool descriptions.</li>
<li><b>Build side:</b> keep CLAUDE.md under 60 lines, point agents at this file and the slice prompt rather than the 20-page spec, use one slice per session, and <code>/clear</code> between them. Use plan mode only for S4 and S6, the slices that move money.</li>
<li>Add prompt caching on system prompts once they're over the 1,024-token minimum. Before that it's not worth it.</li>
</ol></section>

<section><h2>Kick-off prompt for each Sonnet agent</h2>
<pre>Read CLAUDE.md and milestone-pay-wireframe.html (the "Under the hood" data in HOOD{} is the API contract).
Implement slice S4 only: fund milestone, from PayPal button to milestone status "authorized".
- Use paypal.js helpers; never call PayPal from the browser; amount comes from db, never the client.
- All status changes go through transition() in db.js; illegal transitions throw.
- Add/extend scripts/smoke.js for this slice and run it against sandbox before finishing.
Stop when the smoke test passes. Don't touch files outside server.js, paypal.js, public/app.js.</pre></section>

<section><h2>Before you start (30 min, humans)</h2>
<ul><li>PayPal developer dashboard: 1 business sandbox account (Ploy, owns the REST app) and 1 personal account (Nok). Copy the client id and secret into <code>.env</code>.</li>
<li>Anthropic API key in <code>.env</code>. Add a <code>.gitignore</code> for <code>.env</code>, <code>db.json</code> and <code>uploads/</code>.</li>
<li>Run S1 first. If THB authorize → capture fails in sandbox, switch to USD in the API and keep showing THB in the UI.</li></ul></section>`;
}
