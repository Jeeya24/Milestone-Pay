<!doctype html>
<html><head><meta charset="utf-8"><title>chat</title><style>
body{margin:0;background:#8fa7c2;font-family:-apple-system,"Helvetica Neue","Thonburi",sans-serif;width:390px}
.bar{background:#1f2937;color:#fff;padding:14px 16px;font-size:16px;font-weight:600}
.chat{padding:12px 10px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:flex-end;gap:6px}.row.me{justify-content:flex-end}
.name{font-size:11px;color:#1f2937;margin:0 0 2px 4px}
.bubble{max-width:240px;padding:8px 11px;border-radius:16px;font-size:14px;line-height:1.35;background:#fff;color:#111}
.me .bubble{background:#7be08a}.time{font-size:10px;color:#2c3a4b;padding-bottom:2px}
</style></head><body>
<div class="bar">Mali (Mali Bakes)</div><div class="chat">
<div class="row me"><span class="time">10:06</span><div class="bubble">Great. The price is 6,000 THB for logo + brand guide.</div></div>
<div><div class="name">Mali</div><div class="row"><div class="bubble">ตกลงค่ะ ต้องการภายใน 30 พ.ย. นะคะ</div><span class="time">10:08</span></div></div>
<div class="row me"><span class="time">10:09</span><div class="bubble">Deal. I will send the 3 concepts first.</div></div>
<div><div class="name">Mali</div><div class="row"><div class="bubble">โอเคค่ะ 👍</div><span class="time">10:10</span></div></div>
<div class="row me"><span class="time">10:11</span><div class="bubble">Files as PNG and SVG, ok?</div></div>
<div><div class="name">Mali</div><div class="row"><div class="bubble">ได้ค่ะ</div><span class="time">10:12</span></div></div>
</div></body></html>
